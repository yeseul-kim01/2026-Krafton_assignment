<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="요청 패킷이 NIC에서 I/O 브릿지를 거쳐 메모리에 DMA로 실리고, 완료되면 인터럽트로 CPU에 알린다">
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6fd0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="300" rx="16" fill="#ffffff" stroke="#d7dbe3"/>

  <!-- boxes -->
  <rect x="14" y="120" width="118" height="60" rx="9" fill="#f5f7fa" stroke="#d7dbe3" stroke-width="1.5"/>
  <text x="73" y="146" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a2029">클라이언트</text>
  <text x="73" y="164" text-anchor="middle" font-size="10" fill="#565f6d">요청 전송</text>

  <rect x="182" y="120" width="118" height="60" rx="9" fill="#f5f7fa" stroke="#d7dbe3" stroke-width="1.5"/>
  <text x="241" y="146" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a2029">NIC</text>
  <text x="241" y="164" text-anchor="middle" font-size="10" fill="#565f6d">랜카드</text>

  <rect x="350" y="120" width="118" height="60" rx="9" fill="#f5f7fa" stroke="#d7dbe3" stroke-width="1.5"/>
  <text x="409" y="146" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a2029">I/O 브릿지</text>
  <text x="409" y="164" text-anchor="middle" font-size="10" fill="#565f6d">교차로</text>

  <rect x="518" y="120" width="132" height="60" rx="9" fill="#dce9fa" stroke="#1f6fd0" stroke-width="1.5"/>
  <text x="584" y="143" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a2029">메인 메모리</text>
  <text x="584" y="161" text-anchor="middle" font-size="10" fill="#565f6d">소켓 수신 버퍼</text>

  <rect x="700" y="120" width="118" height="60" rx="9" fill="#dce9fa" stroke="#1f6fd0" stroke-width="1.5"/>
  <text x="759" y="146" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a2029">CPU</text>
  <text x="759" y="164" text-anchor="middle" font-size="10" fill="#565f6d">읽어서 처리</text>

  <!-- arrows -->
  <line x1="132" y1="150" x2="180" y2="150" stroke="#1f6fd0" stroke-width="2" marker-end="url(#ah2)"/>
  <line x1="300" y1="150" x2="348" y2="150" stroke="#1f6fd0" stroke-width="2" marker-end="url(#ah2)"/>
  <text x="324" y="140" text-anchor="middle" font-size="9.5" fill="#565f6d">I/O 버스</text>
  <line x1="468" y1="150" x2="516" y2="150" stroke="#1f6fd0" stroke-width="2" marker-end="url(#ah2)"/>
  <text x="492" y="140" text-anchor="middle" font-size="9.5" fill="#565f6d">메모리 버스</text>
  <line x1="650" y1="150" x2="698" y2="150" stroke="#1f6fd0" stroke-width="2" marker-end="url(#ah2)"/>
  <text x="674" y="140" text-anchor="middle" font-size="9.5" fill="#565f6d">시스템 버스</text>

  <!-- DMA bracket -->
  <path d="M241,104 L241,84 L584,84 L584,104" fill="none" stroke="#1f6fd0" stroke-width="2"/>
  <rect x="330" y="56" width="166" height="26" rx="13" fill="#dce9fa" stroke="#1f6fd0" stroke-width="1.3"/>
  <text x="413" y="73" text-anchor="middle" font-size="12" fill="#1f6fd0" font-weight="500">DMA · CPU 안 거침</text>

  <!-- interrupt -->
  <path d="M241,180 L241,246 L759,246 L759,182" fill="none" stroke="#1f6fd0" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah2)"/>
  <rect x="640" y="232" width="150" height="26" rx="13" fill="#f6e6c8" stroke="#bd7a15" stroke-width="1.3"/>
  <text x="715" y="249" text-anchor="middle" font-size="11.5" fill="#bd7a15" font-weight="500">인터럽트 · "다 왔어요"</text>
</svg>
