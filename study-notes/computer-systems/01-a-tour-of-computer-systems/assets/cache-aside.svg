<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="캐시 어사이드 패턴: 앱이 먼저 Redis 캐시를 확인해 있으면 바로 반환(히트), 없으면 DB를 조회한 뒤 캐시에 저장하고 반환한다(미스)">
  <defs>
    <marker id="ca" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6fd0"/>
    </marker>
    <marker id="cg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b9560"/>
    </marker>
    <marker id="cw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bd7a15"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="840" height="380" rx="16" fill="#ffffff" stroke="#d7dbe3"/>
  <text x="30" y="34" font-size="13" font-weight="700" fill="#1a2029">캐시 어사이드 (Cache-Aside) — 장바구니 · 최근 본 상품</text>

  <!-- 사용자 -->
  <rect x="26" y="150" width="110" height="60" rx="9" fill="#f5f7fa" stroke="#d7dbe3" stroke-width="1.5"/>
  <text x="81" y="176" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a2029">사용자</text>
  <text x="81" y="194" text-anchor="middle" font-size="10" fill="#565f6d">최근 본 상품?</text>

  <!-- 앱 서버 -->
  <rect x="196" y="150" width="120" height="60" rx="9" fill="#dce9fa" stroke="#1f6fd0" stroke-width="1.5"/>
  <text x="256" y="176" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a2029">앱 서버</text>
  <text x="256" y="194" text-anchor="middle" font-size="10" fill="#565f6d">Spring / FastAPI</text>

  <!-- Redis (top) -->
  <rect x="470" y="54" width="180" height="72" rx="10" fill="#d7efe2" stroke="#2b9560" stroke-width="1.6"/>
  <text x="560" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2029">Redis 캐시</text>
  <text x="560" y="101" text-anchor="middle" font-size="10.5" fill="#565f6d">메모리(L4) · 빠름 </text>
  <text x="560" y="116" text-anchor="middle" font-size="10" fill="#565f6d">TTL 붙여 잠깐 보관</text>

  <!-- DB (bottom) -->
  <rect x="470" y="238" width="180" height="72" rx="10" fill="#f6e6c8" stroke="#bd7a15" stroke-width="1.6"/>
  <text x="560" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2029">DB</text>
  <text x="560" y="285" text-anchor="middle" font-size="10.5" fill="#565f6d">디스크(L5) · 느림 </text>
  <text x="560" y="300" text-anchor="middle" font-size="10" fill="#565f6d">원본 데이터</text>

  <!-- user -> app -->
  <line x1="136" y1="180" x2="192" y2="180" stroke="#1f6fd0" stroke-width="2" marker-end="url(#ca)"/>

  <!-- app -> redis : ① 먼저 확인 -->
  <line x1="316" y1="168" x2="466" y2="98" stroke="#1f6fd0" stroke-width="2" marker-end="url(#ca)"/>
  <text x="372" y="120" font-size="10.5" fill="#1f6fd0" font-weight="600">① 먼저 캐시 확인</text>

  <!-- HIT: redis -> app (green) -->
  <line x1="466" y1="110" x2="318" y2="176" stroke="#2b9560" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#cg)"/>
  <text x="360" y="158" font-size="10.5" fill="#2b9560" font-weight="700">HIT  바로 반환</text>

  <!-- MISS: app -> db (amber) -->
  <line x1="316" y1="192" x2="466" y2="262" stroke="#bd7a15" stroke-width="2" marker-end="url(#cw)"/>
  <text x="352" y="250" font-size="10.5" fill="#bd7a15" font-weight="700">② MISS면 DB 조회</text>

  <!-- db -> app -->
  <line x1="466" y1="284" x2="318" y2="204" stroke="#bd7a15" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#cw)"/>

  <!-- app -> redis store (③) -->
  <path d="M256,150 C256,40 380,34 470,60" fill="none" stroke="#2b9560" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#cg)"/>
  <text x="300" y="46" font-size="10.5" fill="#2b9560" font-weight="600">③ 캐시에 저장(TTL)</text>

  <!-- app -> user return -->
  <line x1="196" y1="196" x2="140" y2="196" stroke="#1f6fd0" stroke-width="2" marker-end="url(#ca)"/>

  <!-- legend -->
  <rect x="30" y="332" width="14" height="10" rx="2" fill="#d7efe2" stroke="#2b9560" stroke-width="1.3"/>
  <text x="50" y="341" font-size="10.5" fill="#565f6d">빠른 길 (캐시 히트)</text>
  <rect x="210" y="332" width="14" height="10" rx="2" fill="#f6e6c8" stroke="#bd7a15" stroke-width="1.3"/>
  <text x="230" y="341" font-size="10.5" fill="#565f6d">느린 길 (캐시 미스 → DB)</text>
</svg>
