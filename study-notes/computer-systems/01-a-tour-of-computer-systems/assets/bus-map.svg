<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 486" width="780" height="486" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="CPU와 메인 메모리는 빠른 시스템·메모리 버스로, 키보드·디스플레이·디스크·랜카드는 느린 I/O 버스로 I/O 브릿지에 연결된다">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6fd0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="486" rx="16" fill="#ffffff" stroke="#d7dbe3"/>

  <!-- CPU -->
  <rect x="270" y="26" width="240" height="96" rx="10" fill="#dce9fa" stroke="#1f6fd0" stroke-width="1.5"/>
  <text x="390" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2029">CPU (프로세서)</text>
  <rect x="288" y="62" width="94" height="44" rx="6" fill="#f5f7fa" stroke="#d7dbe3" stroke-width="1.5"/>
  <text x="335" y="82" text-anchor="middle" font-size="11" fill="#565f6d">레지스터</text>
  <text x="335" y="96" text-anchor="middle" font-size="11" fill="#565f6d">파일</text>
  <rect x="398" y="62" width="94" height="44" rx="6" fill="#f5f7fa" stroke="#d7dbe3" stroke-width="1.5"/>
  <text x="445" y="89" text-anchor="middle" font-size="11" fill="#565f6d">ALU</text>

  <!-- system bus -->
  <line x1="390" y1="122" x2="390" y2="186" stroke="#1f6fd0" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="390" y1="186" x2="390" y2="122" stroke="#1f6fd0" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="402" y="160" font-size="11.5" fill="#1f6fd0" font-weight="500">① 시스템 버스</text>

  <!-- IO bridge -->
  <rect x="300" y="188" width="180" height="60" rx="10" fill="#f5f7fa" stroke="#d7dbe3" stroke-width="1.5"/>
  <text x="390" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2029">I/O 브릿지</text>
  <text x="390" y="234" text-anchor="middle" font-size="10.5" fill="#565f6d">빠른↔느린 세계의 교차로</text>

  <!-- memory bus + memory -->
  <line x1="480" y1="218" x2="576" y2="218" stroke="#1f6fd0" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="576" y1="218" x2="480" y2="218" stroke="#1f6fd0" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="528" y="207" text-anchor="middle" font-size="11.5" fill="#1f6fd0" font-weight="500">② 메모리 버스</text>
  <rect x="578" y="186" width="176" height="64" rx="10" fill="#dce9fa" stroke="#1f6fd0" stroke-width="1.5"/>
  <text x="666" y="213" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2029">메인 메모리</text>
  <text x="666" y="232" text-anchor="middle" font-size="10.5" fill="#565f6d">DRAM · 실행 중 데이터</text>

  <!-- IO bus -->
  <line x1="390" y1="248" x2="390" y2="296" stroke="#1f6fd0" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="60" y1="310" x2="720" y2="310" stroke="#1f6fd0" stroke-width="2.5"/>
  <line x1="390" y1="296" x2="390" y2="310" stroke="#1f6fd0" stroke-width="2.5"/>
  <text x="72" y="300" font-size="11.5" fill="#1f6fd0" font-weight="500">③ I/O 버스 — 상대적으로 느림</text>

  <!-- USB -->
  <line x1="120" y1="310" x2="120" y2="344" stroke="#1f6fd0" stroke-width="2.5"/>
  <rect x="60" y="346" width="120" height="40" rx="7" fill="#f5f7fa" stroke="#d7dbe3" stroke-width="1.5"/>
  <text x="120" y="370" text-anchor="middle" font-size="11" fill="#565f6d">USB 컨트롤러</text>
  <rect x="72" y="426" width="44" height="34" rx="6" fill="#f5f7fa" stroke="#d7dbe3" stroke-width="1.5"/>
  <text x="94" y="447" text-anchor="middle" font-size="10" fill="#565f6d">키보드</text>
  <rect x="124" y="426" width="44" height="34" rx="6" fill="#f5f7fa" stroke="#d7dbe3" stroke-width="1.5"/>
  <text x="146" y="447" text-anchor="middle" font-size="10" fill="#565f6d">마우스</text>
  <line x1="94" y1="386" x2="94" y2="424" stroke="#1f6fd0" stroke-width="2"/>
  <line x1="146" y1="386" x2="146" y2="424" stroke="#1f6fd0" stroke-width="2"/>

  <!-- Graphics -->
  <line x1="300" y1="310" x2="300" y2="344" stroke="#1f6fd0" stroke-width="2.5"/>
  <rect x="240" y="346" width="120" height="40" rx="7" fill="#f5f7fa" stroke="#d7dbe3" stroke-width="1.5"/>
  <text x="300" y="370" text-anchor="middle" font-size="11" fill="#565f6d">그래픽 어댑터</text>
  <rect x="266" y="426" width="68" height="34" rx="6" fill="#f5f7fa" stroke="#d7dbe3" stroke-width="1.5"/>
  <text x="300" y="447" text-anchor="middle" font-size="10" fill="#565f6d">디스플레이</text>
  <line x1="300" y1="386" x2="300" y2="424" stroke="#1f6fd0" stroke-width="2"/>

  <!-- Disk -->
  <line x1="480" y1="310" x2="480" y2="344" stroke="#1f6fd0" stroke-width="2.5"/>
  <rect x="420" y="346" width="120" height="40" rx="7" fill="#f5f7fa" stroke="#d7dbe3" stroke-width="1.5"/>
  <text x="480" y="370" text-anchor="middle" font-size="11" fill="#565f6d">디스크 컨트롤러</text>
  <rect x="452" y="426" width="56" height="34" rx="6" fill="#f5f7fa" stroke="#d7dbe3" stroke-width="1.5"/>
  <text x="480" y="447" text-anchor="middle" font-size="10" fill="#565f6d">디스크</text>
  <line x1="480" y1="386" x2="480" y2="424" stroke="#1f6fd0" stroke-width="2"/>

  <!-- NIC -->
  <line x1="660" y1="310" x2="660" y2="344" stroke="#1f6fd0" stroke-width="2.5"/>
  <rect x="600" y="346" width="120" height="40" rx="7" fill="#f5f7fa" stroke="#d7dbe3" stroke-width="1.5"/>
  <text x="660" y="370" text-anchor="middle" font-size="11" fill="#565f6d">NIC (랜카드)</text>
  <rect x="632" y="426" width="56" height="34" rx="6" fill="#f5f7fa" stroke="#d7dbe3" stroke-width="1.5"/>
  <text x="660" y="447" text-anchor="middle" font-size="10" fill="#565f6d">네트워크</text>
  <line x1="660" y1="386" x2="660" y2="424" stroke="#1f6fd0" stroke-width="2"/>
</svg>
