<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="I/O 대기 순간, Spring은 스레드를 붙잡아 두고 FastAPI는 같은 스레드를 다음 요청으로 돌린다">
  <defs>
    <marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6fd0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="250" rx="16" fill="#ffffff" stroke="#d7dbe3"/>

  <!-- divider -->
  <line x1="390" y1="20" x2="390" y2="230" stroke="#d7dbe3" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- LEFT: Spring -->
  <text x="40" y="34" font-size="13" font-weight="700" fill="#1a2029">Spring MVC</text>
  <text x="40" y="52" font-size="10.5" fill="#565f6d">기다림 = 스레드를 붙잡아 둠</text>
  <rect x="40" y="70" width="120" height="34" rx="6" fill="#d7efe2" stroke="#2b9560" stroke-width="1.3"/>
  <text x="100" y="92" text-anchor="middle" font-size="11" fill="#2b9560" font-weight="500">스레드 A 처리</text>
  <line x1="160" y1="87" x2="196" y2="87" stroke="#1f6fd0" stroke-width="2" marker-end="url(#ah3)"/>
  <rect x="198" y="70" width="150" height="34" rx="6" fill="#f6e6c8" stroke="#bd7a15" stroke-width="1.3"/>
  <text x="273" y="88" text-anchor="middle" font-size="10.5" fill="#bd7a15" font-weight="500">A가 대기하는 동안</text>
  <text x="273" y="101" text-anchor="middle" font-size="10.5" fill="#bd7a15" font-weight="500">A는 잠김 </text>
  <text x="40" y="150" font-size="11" fill="#bd7a15">→ 새 요청은 새 스레드가 필요</text>
  <text x="40" y="172" font-size="11" fill="#565f6d">동시 처리량 = 스레드 개수에 묶임</text>

  <!-- RIGHT: FastAPI -->
  <text x="410" y="34" font-size="13" font-weight="700" fill="#1a2029">FastAPI async</text>
  <text x="410" y="52" font-size="10.5" fill="#565f6d">기다림 = 스레드를 딴 일로 돌림</text>
  <rect x="410" y="70" width="110" height="34" rx="6" fill="#d7efe2" stroke="#2b9560" stroke-width="1.3"/>
  <text x="465" y="92" text-anchor="middle" font-size="11" fill="#2b9560" font-weight="500">A 처리</text>
  <line x1="520" y1="87" x2="556" y2="87" stroke="#1f6fd0" stroke-width="2" marker-end="url(#ah3)"/>
  <rect x="558" y="70" width="110" height="34" rx="6" fill="#d7efe2" stroke="#2b9560" stroke-width="1.3"/>
  <text x="613" y="92" text-anchor="middle" font-size="11" fill="#2b9560" font-weight="500">곧바로 B 처리</text>
  <rect x="558" y="120" width="150" height="28" rx="6" fill="#f6e6c8" stroke="#bd7a15" stroke-width="1.3" opacity="0.9"/>
  <text x="633" y="139" text-anchor="middle" font-size="10" fill="#bd7a15" font-weight="500">A는 백그라운드에서 대기</text>
  <path d="M465,104 L465,134 L556,134" fill="none" stroke="#1f6fd0" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah3)"/>
  <text x="410" y="172" font-size="11" fill="#2b9560">→ 같은 스레드가 계속 일함</text>
  <text x="410" y="194" font-size="11" fill="#565f6d">동시 처리량 = 대기가 많을수록 ↑</text>
</svg>
