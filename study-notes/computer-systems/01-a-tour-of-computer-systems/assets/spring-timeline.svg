<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 262" width="780" height="262" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="요청 세 개가 각각 스레드 하나씩을 차지하고, DB를 기다리는 구간 동안 그 스레드가 통째로 대기 상태로 멈춘다">
  <rect x="0" y="0" width="780" height="262" rx="16" fill="#ffffff" stroke="#d7dbe3"/>

  <!-- axis -->
  <line x1="120" y1="30" x2="120" y2="222" stroke="#d7dbe3" stroke-width="1"/>
  <line x1="120" y1="222" x2="756" y2="222" stroke="#d7dbe3" stroke-width="1"/>
  <text x="752" y="240" text-anchor="end" font-size="10.5" fill="#565f6d">시간 →</text>

  <!-- lane A -->
  <text x="108" y="60" text-anchor="end" font-size="11" fill="#565f6d">스레드 A</text>
  <rect x="120" y="44" width="120" height="30" rx="5" fill="#d7efe2" stroke="#2b9560" stroke-width="1.3"/>
  <text x="180" y="63" text-anchor="middle" font-size="10.5" fill="#2b9560" font-weight="500">요청 처리</text>
  <rect x="240" y="44" width="230" height="30" rx="5" fill="#f6e6c8" stroke="#bd7a15" stroke-width="1.3"/>
  <text x="355" y="63" text-anchor="middle" font-size="10.5" fill="#bd7a15" font-weight="500">DB 대기 · 스레드 붙잡힘 (블로킹)</text>
  <rect x="470" y="44" width="90" height="30" rx="5" fill="#d7efe2" stroke="#2b9560" stroke-width="1.3"/>
  <text x="515" y="63" text-anchor="middle" font-size="10.5" fill="#2b9560" font-weight="500">재개</text>

  <!-- lane B -->
  <text x="108" y="118" text-anchor="end" font-size="11" fill="#565f6d">스레드 B</text>
  <rect x="120" y="102" width="90" height="30" rx="5" fill="#d7efe2" stroke="#2b9560" stroke-width="1.3"/>
  <text x="165" y="121" text-anchor="middle" font-size="10.5" fill="#2b9560" font-weight="500">처리</text>
  <rect x="210" y="102" width="250" height="30" rx="5" fill="#f6e6c8" stroke="#bd7a15" stroke-width="1.3"/>
  <text x="335" y="121" text-anchor="middle" font-size="10.5" fill="#bd7a15" font-weight="500">DB 대기 · 붙잡힘</text>
  <rect x="460" y="102" width="90" height="30" rx="5" fill="#d7efe2" stroke="#2b9560" stroke-width="1.3"/>
  <text x="505" y="121" text-anchor="middle" font-size="10.5" fill="#2b9560" font-weight="500">재개</text>

  <!-- lane C -->
  <text x="108" y="176" text-anchor="end" font-size="11" fill="#565f6d">스레드 C</text>
  <rect x="120" y="160" width="140" height="30" rx="5" fill="#d7efe2" stroke="#2b9560" stroke-width="1.3"/>
  <text x="190" y="179" text-anchor="middle" font-size="10.5" fill="#2b9560" font-weight="500">요청 처리</text>
  <rect x="260" y="160" width="220" height="30" rx="5" fill="#f6e6c8" stroke="#bd7a15" stroke-width="1.3"/>
  <text x="370" y="179" text-anchor="middle" font-size="10.5" fill="#bd7a15" font-weight="500">DB 대기 · 붙잡힘</text>
  <rect x="480" y="160" width="80" height="30" rx="5" fill="#d7efe2" stroke="#2b9560" stroke-width="1.3"/>
  <text x="520" y="179" text-anchor="middle" font-size="10.5" fill="#2b9560" font-weight="500">재개</text>

  <!-- legend -->
  <rect x="590" y="46" width="14" height="14" rx="3" fill="#d7efe2" stroke="#2b9560" stroke-width="1.3"/>
  <text x="610" y="57" font-size="10.5" fill="#565f6d">CPU 실행</text>
  <rect x="590" y="70" width="14" height="14" rx="3" fill="#f6e6c8" stroke="#bd7a15" stroke-width="1.3"/>
  <text x="610" y="81" font-size="10.5" fill="#565f6d">I/O 대기 · 붙잡힘</text>
</svg>
